name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One job, and it is an emulator job on purpose: a bare-metal package that
# only ever type-checks is a package that has never been proven to boot.
jobs:
  build:
    name: build + run + test (riscv64 & riscv32, qemu)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # ⚠️ Two different numbers, and this is the higher one.
      #   * 2026.8.19.2 is where `mcpp::runner` arrived — below it build.mcpp
      #     does not COMPILE, so that is the hard floor.
      #   * 2026.8.19.3 is where `mcpp build` followed by `mcpp run` stopped
      #     exec'ing the firmware on the host instead of the emulator. The
      #     package works on .2; the documented workflow does not.
      #   * 2026.8.20.2 is where `mcpp::target_libc`, `target_libc_profile` and
      #     `target_builtins_lib` arrived. 0.4.0 removed three hardcoded names
      #     from build.mcpp by asking for them instead, so this is a hard floor
      #     for the package as well: below it build.mcpp does not compile.
      #
      # ⚠️ THIS PIN HAS BEEN WRONG TWICE, THE SAME WAY BOTH TIMES.
      #
      # A package developed against an unreleased engine gets a pin naming a
      # version that does not exist yet, and CI reports `not found in the synced
      # index` (0.3.0) or `no member named ...` (0.4.1) — never "the pin is from
      # the future", which is what actually happened. The order that avoids it
      # is: raise the pin, release the engine, then push.
      #
      # CI pins what the README tells people to use.
      MCPP_VERSION: 2026.8.20.2
      XLINGS_VERSION: v2026.8.17.2
      XLINGS_NON_INTERACTIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install mcpp
        run: |
          # ⚠️ A LOOP, BECAUSE ONE `xlings update` CAN RETURN A STALE INDEX
          # WITHOUT SAYING SO.
          #
          # The index is published as an artifact behind a pointer, and that
          # pointer propagates asynchronously after a version bump is merged.
          # Measured on release day: an update run four minutes after the merge
          # printed `index updated`, and the install then failed with
          #
          #     package 'mcpp@<ver>' not found in the synced index
          #     (xim@artifact:<an older sha>, ...), synced 0 seconds ago
          #
          # Nothing had gone wrong. The update fetched the PREVIOUS artifact,
          # and "synced 0 seconds ago" describes when it was fetched rather than
          # what it contains — which is why the message reads as freshness.
          #
          # So this is not a retry around flakiness; it is the wait that a
          # single update does not perform. A pin naming a version that was
          # never published still fails, after the last attempt, and says which
          # of the two situations it is.
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            if [ "$attempt" = 6 ]; then
              echo "::error::mcpp@$MCPP_VERSION never appeared in the index (6 attempts over 5 minutes). If it was just released, the pointer has not propagated; if the pin names a version that was never published, it never will."
              exit 1
            fi
            echo "the index has not caught up yet (attempt $attempt of 6); waiting 60s"
            sleep 60
          done
          mcpp --version
          mcpp self config --mirror GLOBAL

      - name: Install the target world
        run: |
          # ⚠️ BOTH homes, and this is not belt-and-braces. The shim on PATH
          # dispatches against whichever home owns it, while `mcpp run` starts
          # the runner through mcpp's own home — an emulator present in only
          # one of them answers "not installed" from the other.
          xlings install xim:qemu-riscv -y
          XLINGS_HOME="$HOME/.mcpp/registry" xlings install xim:qemu-riscv -y
          # ⚠️ PICOLIBC TOO, AND THE COMMENT THAT USED TO STAND HERE WAS WRONG.
          #
          # It read: "NOT picolibc — mcpp installs the target's C library itself
          # from the target's row; installing it here would hide a regression in
          # that." mcpp does no such thing. It resolves the COMPILER through an
          # installing call; the target's C library it only looks UP on disk,
          # and when absent it silently adds no paths.
          #
          # The gap is closed for CONSUMERS by an install-time edge in this
          # package's index descriptor — `deps` names `xim:picolibc-riscv`, and
          # taking both away and rebuilding brings both back. That edge fires
          # when the PACKAGE is installed, and a repository testing itself
          # builds from its working tree, where nothing is installed and nothing
          # fires. So the self-build has to be given what a consumer is given.
          #
          # Measured on a cold runner without it: `picolibc` appears nowhere in
          # the whole log, and every build dies on `'stdio.h' file not found`
          # pointing at this package's own module.
          xlings install xim:picolibc-riscv -y
          XLINGS_HOME="$HOME/.mcpp/registry" xlings install xim:picolibc-riscv -y

      # ⚠️ TWICE, AND THE FIRST IS ALLOWED TO FAIL. THIS IS NOT SUPERSTITION.
      #
      # mcpp installs the target's C library LAZILY — during a build, from the
      # target's own row. So the very first build on a machine that has never
      # targeted this triple compiles sources that need its headers before they
      # exist, and dies on `'stdio.h' file not found` or `'inttypes.h' file not
      # found` pointing inside a dependency. The second build has them. mcpp
      # says as much itself for the sibling case: "expected on the first build
      # in a fresh MCPP_HOME; a second build resolves it."
      #
      # ⚠️ Deliberately NOT `xlings install xim:picolibc-riscv`. That would make
      # the target world exist without going through the engine's own install,
      # and a regression in that install is exactly what this repository would
      # then stop noticing. A warm-up build exercises it; a manual install
      # replaces it.
      - name: Warm the target world (mcpp installs the C library lazily)
        run: |
          # The target C library, for the same reason the job above installs
          # it: the index edge that gives a CONSUMER picolibc fires when the
          # PACKAGE is installed, and this builds the working tree.
          xlings install xim:picolibc-riscv -y
          XLINGS_HOME="$HOME/.mcpp/registry" xlings install xim:picolibc-riscv -y
          mcpp build --target riscv64-none-elf || true

      - name: Self-test (rv64)
        run: |
          mcpp build --target riscv64-none-elf
          # ⚠️ `--features openkal`, AND FOR TWO REASONS THAT POINT THE SAME WAY.
          #
          # The good reason: this package ships that feature, and a self-test
          # that never activates it tests less than the package promises.
          #
          # The other reason is an engine defect, recorded here because the flag
          # would otherwise look optional. Measured 2026-08-20: `mcpp build`
          # excludes an inactive feature's sources and `mcpp test` compiles them.
          # In prepare.cppm the ADD of feature globs runs in both modes while the
          # DROP is gated on `!includeDevDeps` — a deliberate choice for gtest's
          # `main` feature, whose file must stay visible to the per-test main
          # detection, generalised to every package. So without this flag
          # `mcpp test` compiles `src/kal/**` with the feature OFF and dies on
          # `'openkal/abort.h' file not found`, while `mcpp build` is fine.
          mcpp test  --target riscv64-none-elf --features openkal 2>&1 | tee test64.log
          # ⚠️ A suite that discovered nothing exits 0. Assert the case RAN.
          grep -q 'console ... ok' test64.log

      - name: Self-test (rv32)
        run: |
          # The second profile exists to prove the ISA table is data, not a
          # second copy of the package. It links; qemu-system-riscv32 boots it.
          mcpp build --target riscv32-none-elf
          mcpp test  --target riscv32-none-elf --features openkal 2>&1 | tee test32.log
          grep -q 'console ... ok' test32.log

      - name: The example is the README's claim, executed
        working-directory: examples/blinky
        run: |
          mcpp run --target riscv64-none-elf 2>&1 | tee run.log
          # Each line proves a different part of the chain: the module, the
          # float path (which is what needs compiler-rt builtins), the heap.
          grep -q 'hello from qemu virt' run.log
          grep -q 'float 3.1416'         run.log
          grep -q 'heap ok'              run.log

      # ⚠️ THE ZERO-LIBC TIER, BOTH SIDES. THIS BOARD ANSWERED THE QUESTION
      # THREE DIFFERENT WAYS IN THREE VERSIONS, WHICH IS WHY IT IS TESTED.
      #
      # 0.4.0 refused, 0.4.1 degraded silently, 0.5.0 serves the tier behind a
      # feature. Each answer looked right until the next question — and what
      # survives a fourth change of mind is not a comment but a test that states
      # the outcome on both sides.
      #
      # The positive side asserts the LINK ADDRESS rather than any output,
      # because that is what proves the board's own memory map was used. An
      # image that printed would prove only that something printed; 0x80000000
      # is in `virt.ld` and nowhere in the consumer.
      - name: With `nolibc`, the board serves a project that has no C library
        run: |
          mkdir -p /tmp/nl/src
          cat > /tmp/nl/mcpp.toml <<EOF
          [package]
          name    = "nl"
          version = "0.1.0"

          [build]
          target = "riscv64-none-elf"

          [target.riscv64-none-elf]
          sysroot = ""

          [dependencies]
          riscv-virt-rt = { path = "$GITHUB_WORKSPACE", features = ["nolibc"] }
          EOF
          cat > /tmp/nl/src/main.cpp <<'EOF'
          import mcpplibs.riscv_virt_rt;
          extern "C" [[noreturn]] void _start() {
              board::println("bsp nolibc console ok");
              board::poweroff();
          }
          EOF
          (cd /tmp/nl && mcpp build --target riscv64-none-elf)

          elf="$(find /tmp/nl/target -name nl -type f | head -1)"
          test -n "$elf"
          READELF="$(find "$HOME/.mcpp/registry/data/xpkgs" -name llvm-readelf | head -1)"
          NM="$(find "$HOME/.mcpp/registry/data/xpkgs" -name llvm-nm | head -1)"

          # The board's virt.ld put .text here. Nothing in the consumer says so.
          "$READELF" -S "$elf" | grep -E '\.text' | grep -q '0000000080000000'

          # And it depends on nothing: there is no C library to depend on, so an
          # undefined symbol would mean the link silently expected one.
          undef="$("$NM" -u "$elf" | wc -l)"
          test "$undef" -eq 0 || { "$NM" -u "$elf"; echo "expected no undefined symbols"; exit 1; }

          # The symbols the board's script exports reached the image.
          "$NM" "$elf" | grep -q '__stack_top'

      # The negative side: the same project without the feature must FAIL, and
      # must not quietly produce an image.
      #
      # ⚠️ ASSERTED ON THE EXIT STATUS AND NOT ON THE MESSAGE, WHICH IS A
      # CONCESSION AND IS RECORDED AS ONE. The message here is
      # `fatal error: 'stdio.h' file not found`, pointing inside this package —
      # unhelpful, and this package cannot replace it. A named refusal would
      # need build.mcpp to distinguish "the project declined the C library" from
      # "the C library is not installed yet", and `mcpp::target_libc()` answers
      # from the payload on disk, so those two are one observation. Until the
      # engine answers that query from the target table instead, the honest
      # assertion is that the arrangement does not silently work.
      - name: Without the feature, the same project does not build
        run: |
          sed -i 's/, features = \["nolibc"\]//' /tmp/nl/mcpp.toml
          rm -rf /tmp/nl/target
          if (cd /tmp/nl && mcpp build --target riscv64-none-elf > out.log 2>&1); then
            echo "a project that declined the C library built against a picolibc board"
            exit 1
          fi
          echo "refused, as it must be:"; tail -5 /tmp/nl/out.log

      # Both templates target the same machine; the difference is how much of
      # this board's datasheet each copies into the project. A template that
      # generates a project which does not build is a defect only the generated
      # project can reveal — measured once already, on `nolibc`.
      #
      # ⚠️ INSTANTIATED FROM THE WORKING TREE, NOT THROUGH `mcpp new`. The
      # scaffolder resolves `--template` from the INDEX and takes no path, so
      # asking it for a template this commit ADDS would resolve the previously
      # published version and fail on a template it does not carry — the CI for
      # a new template could never pass before that template was published.
      # What belongs to this repository is the template's CONTENT; the
      # scaffolder's own behaviour is covered by mcpp's e2e suite. Substituting
      # the one placeholder is exactly what `mcpp new` does to these files.
      - name: Both zero-libc templates generate projects that build
        run: |
          for t in nolibc nolibc-bsp; do
            d="/tmp/t-$t"; rm -rf "$d"; mkdir -p "$d/src"
            for f in mcpp.toml src/main.cpp; do
              sed "s/{{project.name}}/k/g" "templates/$t/$f.in" > "$d/$f"
            done
            for extra in link.ld build.mcpp; do
              [ -f "templates/$t/$extra.in" ] \
                && sed "s/{{project.name}}/k/g" "templates/$t/$extra.in" > "$d/$extra"
            done
            # The dependency line the scaffolder writes, at the version under
            # test — by path, because that version is not published yet.
            if grep -q 'self = {' "templates/$t/template.toml"; then
              feats=$(sed -n 's/.*features = \[\(.*\)\].*/\1/p' "templates/$t/template.toml")
              printf '\n[dependencies]\nriscv-virt-rt = { path = "%s", features = [%s] }\n' \
                "$GITHUB_WORKSPACE" "$feats" >> "$d/mcpp.toml"
            fi
            (cd "$d" && mcpp build --target riscv64-none-elf)
            echo "$t: builds, $(find "$d" -type f -not -path '*/target/*' | wc -l) files"
          done

      - name: The artifact set a flasher needs
        working-directory: examples/blinky
        run: |
          elf="$(find target/riscv32-none-elf target/riscv64-none-elf \
                   -name firmware -type f | head -1)"
          test -n "$elf"
          test -f "$elf.bin"
          test -f "$elf.map"

  # ---------------------------------------------------------------------------
  # The cross-compilation is performed FROM three systems, not only from Linux.
  #
  # Every target in this repository is a cross target, which makes the host a
  # separate axis from the target: the compiler, the target C library and the
  # emulator are payloads mcpp resolves for whichever system it is running on.
  # A package that has only ever been built from Linux is a package whose
  # consumers must use Linux, and nothing in these sources says so.
  #
  # ⚠️ A TOOLCHAIN AXIS IS ABSENT HERE, AND THAT IS MEASURED RATHER THAN
  # ASSUMED. The row for a bare-metal triple names its compiler, and the
  # command-line override does not displace it: `--toolchain gcc@16.1.0` on a
  # `riscv64-none-elf` build resolves llvm@22.1.8 regardless. A matrix over
  # compiler families would therefore run the same compiler on every row and
  # report coverage it does not have. The toolchain axis belongs where the
  # choice is real — openkal, whose declarations are compiled by three families
  # on three systems.
  #
  # ⚠️ BUILD ONLY, AND DELIBERATELY. Behaviour is asserted once, above, under an
  # emulator. Booting the same image from three systems would be a statement
  # about the emulator rather than about this package, and "the image does what
  # the README says" does not become more true for having been observed from
  # macOS.
  portability:
    name: cross-builds from ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    defaults:
      run:
        shell: bash
    env:
      MCPP_VERSION: 2026.8.20.2
      XLINGS_VERSION: v2026.8.17.2
      XLINGS_NON_INTERACTIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          # The installer amends the user's environment; no later step in this
          # job reads it back, so the directory is named here.
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install mcpp
        run: |
          # ⚠️ A LOOP, BECAUSE ONE `xlings update` CAN RETURN A STALE INDEX
          # WITHOUT SAYING SO.
          #
          # The index is published as an artifact behind a pointer, and that
          # pointer propagates asynchronously after a version bump is merged.
          # Measured on release day: an update run four minutes after the merge
          # printed `index updated`, and the install then failed with
          #
          #     package 'mcpp@<ver>' not found in the synced index
          #     (xim@artifact:<an older sha>, ...), synced 0 seconds ago
          #
          # Nothing had gone wrong. The update fetched the PREVIOUS artifact,
          # and "synced 0 seconds ago" describes when it was fetched rather than
          # what it contains — which is why the message reads as freshness.
          #
          # So this is not a retry around flakiness; it is the wait that a
          # single update does not perform. A pin naming a version that was
          # never published still fails, after the last attempt, and says which
          # of the two situations it is.
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            if [ "$attempt" = 6 ]; then
              echo "::error::mcpp@$MCPP_VERSION never appeared in the index (6 attempts over 5 minutes). If it was just released, the pointer has not propagated; if the pin names a version that was never published, it never will."
              exit 1
            fi
            echo "the index has not caught up yet (attempt $attempt of 6); waiting 60s"
            sleep 60
          done
          mcpp --version
          mcpp self config --mirror GLOBAL

      - name: Both profiles cross-build
        run: |
          # ⚠️ TWICE, AND THE FIRST IS ALLOWED TO FAIL — every row of this
          # matrix is a machine that has never targeted this triple, which is
          # precisely where mcpp's lazy install of the target C library shows.
          # The first build compiles sources needing its headers before they
          # exist; the second has them. A single build here reported a
          # portability failure that was really a cold-machine one.
          mcpp build --target riscv64-none-elf || true
          mcpp build --target riscv32-none-elf || true
          mcpp build --target riscv64-none-elf
          mcpp build --target riscv32-none-elf

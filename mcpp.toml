[package]
namespace   = "mcpplibs"
name        = "riscv-virt-rt"
version     = "0.5.0"
description = "Board support for QEMU's RISC-V `virt` machine — startup selection, memory layout, runner, and an optional openkal backend"
license     = "Apache-2.0"
authors     = ["mcpplibs"]
repo        = "https://github.com/mcpplibs/riscv-virt-rt"

# ⚠️ The EMULATOR only. The target's C library used to be declared here too,
# and should never have been: it is a property of the target, and mcpp resolves
# it from the target's own row exactly as it resolves the compiler — a hosted
# project does not declare glibc either. What is left is the one thing that
# really is a board fact: how to run an image.
[xlings]
deps = ["xim:qemu-riscv@9.2.4-1"]

# ── openkal, when the consumer asks for it ───────────────────────────────────
#
# ⚠️ THE BACKEND BELONGS TO THE BOARD, AND THE SELECTION KEY IS THIS DEPENDENCY.
#
# openkal's design sketched a bare-metal backend chosen by an ISA-level
# predicate, `cfg(all(arch = "riscv64", os = "none"))`. That key is wrong in the
# quiet direction: a console is a store to a fixed address, and which address is
# a BOARD fact. On a second RISC-V board the predicate still matches, the same
# package is still selected, and the program writes to something that is not a
# UART — it compiles, links, runs, and prints nothing.
#
# A bare-metal project already depends on its board. Making the board supply the
# backend puts the selection where the knowledge is, and the consumer writes one
# feature and no `cfg`.
#
# The core set only (abort, stream, memory). An implementation provides an
# interface in whole or not at all, so the absence of fs, process, task, env and
# time is not a deviation — `import openkal.task;` simply does not resolve.
[features]
default = []
openkal = { sources = ["src/kal/**"] }

# ⚠️ THE C LIBRARY IS A FEATURE OF HOW THIS BOARD IS CONSUMED, NOT A PROPERTY OF
# THE BOARD.
#
# 0.4.0 and 0.4.1 both assumed the opposite and answered "no C library" by
# refusing and then by degrading. The premise was wrong: a RISC-V developer
# working without a C library needs MORE of a board package, not less. Which
# emulator boots this machine, where its UART is, where RAM begins — none of
# those are C library facts, and refusing merely moved them, hardcoded, into
# every kernel project.
#
# With this feature the board contributes the half that needs no C library: the
# memory map (virt.ld), a UART console, and the emulator to run under. It
# carries no sources of its own — the module is one file describing the same
# machine twice, and `-DMCPP_FEATURE_NOLIBC` selects which half compiles.
#
# What it deliberately does NOT supply, because a board package supplying them
# would be supplying a second one: formatting (std-freestanding), an allocator
# (std-freestanding with alloc-kal), and memcpy/memset (std-freestanding-nolibc,
# which provides them once for every board).
nolibc  = {}

# Resolved only when the feature is active, so a consumer that does not use
# openkal pulls neither the declarations nor the implementation.
[feature-deps.openkal]
openkal = "0.5.1"
